<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Editor | Heidi's Portfolio</title>
    <link rel="stylesheet" href="portfolio-pages.css" />
  </head>
  <body>
    <main>
      <div class="topbar"><nav><a href="index.html">Back to portfolio</a></nav></div>
      <header class="page-head"><div><p class="eyebrow">Private workspace</p><h1>Portfolio Editor</h1></div></header>
      <section class="edit-form" style="display:block; max-width:760px; margin:0 auto 64px">
        <p>Turn editor mode on, then choose where you want to make changes.</p>
        <div class="edit-actions">
          <button class="primary" id="editor-on" type="button">Turn editor on</button>
          <button id="editor-off" type="button">Turn editor off</button>
          <a href="index.html">Edit homepage</a>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
        <h2>Edit a project</h2>
        <div id="project-links" class="edit-actions"></div>
      </section>
    </main>
    <script src="portfolio-data.js"></script>
    <script>
      const status = document.getElementById("status");
      function setMode(enabled) {
        localStorage.setItem("portfolio-editor-mode", String(enabled));
        status.textContent = enabled ? "Editor mode is on in this browser." : "Editor mode is off.";
      }
      document.getElementById("editor-on").addEventListener("click", () => setMode(true));
      document.getElementById("editor-off").addEventListener("click", () => setMode(false));
      document.getElementById("project-links").innerHTML = window.PORTFOLIO_PROJECTS.map((project) =>
        `<a href="project.html?project=${project.id}">${project.title}</a>`
      ).join("");
    </script>
  </body>
</html>
