<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life in Frames | Heidi's Portfolio</title><link rel="stylesheet" href="portfolio-pages.css"><link rel="stylesheet" href="home-story.css"></head><body><main class="photo-gallery-page"><p class="story-number">Personal Archive</p><h1>Life in Frames</h1><p class="gallery-intro">A growing collection of people, places, and everyday moments beyond the project work.</p><div class="life-gallery-grid" id="life-gallery-grid"></div><p class="gallery-back"><a href="/">Back to Heidi's portfolio</a></p></main><script>const defaults=[{src:"/portfolio/bloom-nest.jpg",alt:"A creative study from Heidi's everyday making practice"},{src:"/portfolio/bridge.jpg",alt:"A structural study representing curiosity and exploration"},{src:"/portfolio/freehand-sketch.jpg",alt:"A sketch from Heidi's personal creative process"},{src:"/portfolio/circuits.jpg",alt:"An electronic experiment from Heidi's hands-on practice"}];let photos=defaults;try{const saved=JSON.parse(localStorage.getItem("portfolio-life-photos")||"null");if(Array.isArray(saved)&&saved.length)photos=saved}catch{}document.getElementById("life-gallery-grid").innerHTML=photos.map((photo,index)=>`<figure id="photo-${index+1}"><img src="${photo.src}" alt="${photo.alt}"><figcaption>${String(index+1).padStart(2,"0")} / ${photo.alt}</figcaption></figure>`).join("");</script></body></html>
