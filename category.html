<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Category | Heidi's Portfolio</title>
    <link rel="stylesheet" href="portfolio-pages.css" />
  </head>
  <body>
    <div class="corner-tools">
      <button class="tool-icon editor-toggle" type="button" aria-label="Turn on portfolio editor" aria-pressed="false" title="Turn editor on">🔧</button>
      <details class="category-menu">
        <summary class="tool-icon" aria-label="Open category menu" title="Categories"><span class="menu-lines" aria-hidden="true"><i></i><i></i><i></i></span></summary>
        <nav aria-label="Portfolio categories">
          <a href="index.html">Main Page</a>
          <a href="category.html?category=architecture">Architecture</a>
          <a href="category.html?category=electronic-engineering">Electronic Engineering</a>
          <a href="category.html?category=sports">Sports</a>
          <a href="category.html?category=music">Music</a>
        </nav>
      </details>
    </div>
    <main>
      <div class="topbar">
        <nav aria-label="Category navigation">
          <a href="index.html">Back to home</a>
        </nav>
      </div>

      <header class="page-head">
        <div>
          <p class="eyebrow">Category Showcase</p>
          <h1 id="category-title">Portfolio Work</h1>
        </div>
        <p id="category-copy">
          Selected projects from this category, with room to compare final work,
          process images, and project notes.
        </p>
      </header>

      <section class="project-grid" id="project-grid" aria-label="Projects"></section>

      <footer>
        <p>Choose a project to see more images.</p>
      </footer>
    </main>

    <script src="portfolio-data.js"></script>
    <script src="inline-editor.js" defer></script>
    <script src="page-content-editor.js" defer></script>
    <script src="public/layout-editor.js" defer></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const category = params.get("category") || "architecture";
      const titles = {
        architecture: "Architecture + Physical Work",
        "electronic-engineering": "Electronic Engineering",
        sports: "Sports",
        music: "Music"
      };
      const copy = {
        architecture: "Models, spatial studies, and physical pieces curated for admissions reviewers.",
        "electronic-engineering": "Hands-on circuit and prototype work showing systems thinking and making.",
        sports: "This category is ready for future sports work.",
        music: "This category is ready for future music work."
      };

      document.title = `${titles[category] || "Portfolio Work"} | Heidi's Portfolio`;
      document.getElementById("category-title").textContent = titles[category] || "Portfolio Work";
      document.getElementById("category-copy").textContent = copy[category] || copy.architecture;

      function editorMode() {
        return localStorage.getItem("portfolio-editor-mode") === "true";
      }

      function toggleEditorMode() {
        localStorage.setItem("portfolio-editor-mode", String(!editorMode()));
        syncEditorMode();
      }

      function syncEditorMode() {
        const enabled = editorMode();
        document.body.classList.toggle("editor-mode", enabled);
        document.querySelectorAll(".editor-toggle").forEach((button) => {
          button.setAttribute("aria-pressed", String(enabled));
          button.setAttribute("aria-label", enabled ? "Turn off portfolio editor" : "Turn on portfolio editor");
          button.title = enabled ? "Turn editor off" : "Turn editor on";
        });
        const toggle = document.getElementById("editor-mode-toggle");
        if (toggle) {
          toggle.setAttribute("aria-pressed", String(enabled));
        }
      }

      function hiddenImages(project) {
        try {
          return JSON.parse(localStorage.getItem(`hidden-images:${project.id}`)) || [];
        } catch {
          return [];
        }
      }

      function extraImages(project) {
        try {
          return JSON.parse(localStorage.getItem(`extra-images:${project.id}`)) || [];
        } catch {
          return [];
        }
      }

      function allImages(project) {
        return [...project.images, ...extraImages(project)];
      }

      function displayImage(project) {
        const hidden = new Set(hiddenImages(project));
        const saved = localStorage.getItem(`display-image:${project.id}`);
        const images = allImages(project);
        if (saved && images.includes(saved) && !hidden.has(saved)) {
          return saved;
        }
        return images.find((image) => !hidden.has(image)) || project.cover;
      }

      function projectTitle(project) {
        return localStorage.getItem(`project-title:${project.id}`) || project.title;
      }

      function projectSummary(project) {
        return localStorage.getItem(`project-summary:${project.id}`) || project.summary;
      }

      function escapeHTML(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      const projects = window.PORTFOLIO_PROJECTS.filter((project) => project.category === category);
      const grid = document.getElementById("project-grid");

      grid.innerHTML = projects.map((project) => {
        const title = escapeHTML(projectTitle(project));
        const summary = escapeHTML(projectSummary(project));
        return `
        <a class="project-card" href="project.html?project=${project.id}">
          <div class="project-image-wrap">
            <img src="${displayImage(project)}" alt="${title}">
          </div>
          <div class="project-copy">
            <div class="project-kicker"><span>${project.categoryLabel}</span><span>${project.year}</span></div>
            <h2>${title}</h2>
            <p>${summary}</p>
            <span class="open-link">Open project</span>
          </div>
        </a>
      `;
      }).join("");

      const editorToggle = document.getElementById("editor-mode-toggle");
      if (editorToggle) {
        editorToggle.addEventListener("click", () => {
          syncEditorMode();
        });
      }

      syncEditorMode();
      document.querySelectorAll(".editor-toggle").forEach((button) => {
        button.setAttribute("aria-pressed", String(editorMode()));
        button.addEventListener("click", () => {
          toggleEditorMode();
          button.setAttribute("aria-pressed", String(editorMode()));
        });
      });
    </script>
  </body>
</html>
